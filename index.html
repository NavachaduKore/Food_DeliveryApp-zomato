<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FastBite - Food Delivery</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      background-color: #f8fafc;
      color: #1e293b;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 { color: #ea580c; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      border-top: 4px solid #ea580c;
    }
    .price {
      font-weight: bold;
      color: #16a34a;
      margin: 0.5rem 0;
    }
    button {
      background-color: #ea580c;
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
    }
    button:hover { background-color: #c2410c; }
  </style>
</head>
<body>
  <header>
    <h1>🍕 FastBite Delivery</h1>
    <p>Fresh meals delivered straight to your door.</p>
  </header>

  <main class="grid">
    <div class="card">
      <h3>Margherita Pizza</h3>
      <p>Classic tomato sauce, fresh mozzarella, and basil.</p>
      <div class="price">$12.50</div>
      <button onclick="alert('Order placed for Margherita Pizza!')">Order Now</button>
    </div>

    <div class="card">
      <h3>Crispy Chicken Burger</h3>
      <p>Fried chicken patty with spicy mayo and pickles.</p>
      <div class="price">$9.99</div>
      <button onclick="alert('Order placed for Chicken Burger!')">Order Now</button>
    </div>

    <div class="card">
      <h3>Tonkotsu Ramen</h3>
      <p>Rich pork broth, soft-boiled egg, and chashu.</p>
      <div class="price">$14.00</div>
      <button onclick="alert('Order placed for Tonkotsu Ramen!')">Order Now</button>
    </div>
  </main>
</body>
</html>
